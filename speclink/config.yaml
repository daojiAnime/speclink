schema: spec-driven

worktree: true

locale: tw
spec_locale: tw
tdd: true
audit: true
context: |
  ## Project

  Speclink — an auditable SDD (Spec-Driven Development) engine written in Rust: every
  change starts with a small spec, is handed to an AI agent to implement, and before
  archiving passes through two quality stations (review and verify) that leave recorded
  evidence. It supports both local projects (`speclink/` + Git, fully offline) and
  remote projects (specs held by a Server: either a host embedding the engine or the
  official reference server).

  Tech stack: Rust (serde / chrono / anyhow / clap / ulid; ureq for HTTP client; tokio
  + axum for async), three storage-port examples using rusqlite / postgres / filesystem,
  Node SDK via napi-rs, Desktop via Tauri; frontend uses React + TypeScript + Vite +
  Tailwind + Radix UI + zustand, tested with vitest; drift and archive invoke git.

  Cargo workspace: `speclink-core` (SDD engine), `speclink-fs` (default filesystem
  implementation of the storage port, preserving the `speclink/` layout),
  `speclink-store-port` (storage contract: list, read, commit operations, conformance
  tests, and in-memory reference implementation) + `speclink-store-port-{sqlite,fs,postgres}`
  (three examples, also used as storage for the reference server), `speclink-host` (the
  engine's sole application boundary and host kit: execution context, commands executed
  through the storage port, hooks, HTTP entrypoints, import/export), `speclink-protocol`
  (wire contract, Rust types as canon, JSON Schema as export) + `speclink-remote` (typed
  client), `speclink-cli`, `speclink-server` (reference server, axum adapter — the only
  async boundary), `speclink-node` (napi-rs bindings; the core engine stays synchronous).
  Desktop and frontend: `apps/desktop/core` (pure logic, no Tauri dependency) +
  `apps/desktop/src-tauri` (Tauri shell), `apps/desktop`, `apps/server-web`,
  `packages/ui`.

  Current status and limits live in `docs/product-status.zh-TW.md`;
  upcoming direction lives in `docs/roadmap.zh-TW.md`.

  ## Cross-artifact load-bearing constraints

  - **Both human and machine output are contracts**: when a command provides both human
    output (ANSI colors, supports `--no-color`) and `--json`, both outputs are contracts;
    `--json` fields are always camelCase, and field names themselves are part of the contract.
  - **Existing outputs are regression-protected**: human output and `--json` shape are
    established contracts; verify before and after changes with golden snapshots
    (`cargo test -p speclink-core --test it render_golden::`) and CLI tests that nothing
    shifted unintentionally. Deliberate changes update goldens in the same batch and
    document compatibility impact in the corresponding artifact.
  - **Configuration has three layers**: `speclink/config.yaml` (workflow policy, travels
    with the spec store), `.speclink.yaml` (this checkout's `tools` and `spec_dir`), and
    `SPECLINK_*` environment variables (personal/CI overrides).
  - **Remote paths must not reuse local-only assumptions**: Remote / Server / Desktop
    cross Tokio, Axum, HTTP, SQLite, PostgreSQL, and OS Keychain boundaries — errors,
    timeouts, authentication, revisions, and transactions must all be handled.
  - **Cross-platform**: Windows / macOS / Linux — path separators, line endings, and git
    behavior must not assume a single platform.
rules:
  proposal:
  - Must state the target users (primarily developers working with AI agents; in team settings also POs and PMs) and usage scenario (which workflow stage or skill it corresponds to)
  - Must explicitly name affected crates or apps (e.g., speclink-core / speclink-cli / speclink-host / apps/desktop)
  - When adding or changing CLI commands, must specify subcommands, flags, stdin, and exit codes
  - 'When changing existing command output or behavior, must include a "Compatibility Impact" section: what changes in human and `--json` output, whether regression snapshots break, and how existing users migrate'
  - When involving configuration fields (speclink/config.yaml / .speclink.yaml), must document added or changed fields and their defaults
  - When involving generated skills or agent instructions, must specify which skills and which tools (claude / codex) are affected
  - 'When adding or changing engine commands, verbs, document types, or skill steps, must state the outcome for each of the three topologies — local repo, remote-connected checkout, and embedded host without local spec files: available, not applicable (with reason), or out of scope for now (recorded as a known gap)'
  design:
  - 'Must specify which crate owns the change and its boundary: domain algorithms belong in speclink-core (no ANSI or hardcoded storage medium), Local Repo I/O belongs in speclink-fs, storage contract and examples belong in store crates, application-layer orchestration belongs in speclink-host; CLI / Server / Node / Desktop only assemble inputs and render outputs through stable Host or Protocol contracts'
  - 'When a single external contract runs across local, remote-connected, and embedded host (CLI / server / desktop / Node SDK) paths, must specify the single implementation site and how every consumer shares it — never build two parallel implementations (regression reference: crates/adapters/speclink-cli/tests/it/remote_verb_parity.rs); when new engine features need local checkout facts (modified files, file fingerprints, commits), the caller collects and passes them as input instead of the engine reading the checkout or invoking git directly, and all document reads/writes go through the storage port'
  - Designs that edit YAML via text surgery (.meta.yaml, speclink/config.yaml) must escape scalars with yaml_scalar in crates/engine/speclink-core/src/util.rs and never hand-concatenate unescaped scalars
  - When a verb triggers multiple writes or deletes, must specify write order and observable state if any step fails (no partial state left behind, or explicitly document which partial state is accepted and why)
  - Desktop logic and tests belong in speclink-desktop-core (no Tauri dependency, testable independently with cargo test); each Tauri shell command is a single-line delegation
  - CLI subcommands use kebab-case or space-separated verbs (new change, task done, discuss add-round); module files use snake_case.rs
  - Functions and variables use snake_case; types and enums use PascalCase; constants use UPPER_SNAKE_CASE; flags use kebab-case (--no-color, --strict, --all, --json)
  - '`--json` fields are always camelCase (via #[serde(rename)]), and field names are an external contract'
  - When involving serialization or configuration, must specify the serde structure and backward compatibility (able to read existing files)
  - When involving git interaction (drift / archive), must specify the git behaviors used and cross-platform considerations
  - Decisions affecting spec storage or workflow abstraction must explain how they move toward a storage-decoupled spec-driven engine (or why not yet)
  - The Risks section must prioritize regression coverage (golden and CLI tests) and cross-platform behavior (Windows / macOS / Linux)
  - When adding or modifying system-wide shared frontend behavior (e.g., back navigation, keyboard shortcuts), must specify the single implementation site and how each page wires into it — never reimplement per page
  - Shared frontend components must reuse existing primitives and domain components from @speclink/ui, listing which existing components or editors are reused (or justifying why not); when an appearance not covered by existing variants is needed, plan a new variant in @speclink/ui; apps/* must not define components with the same exported name as @speclink/ui
  specs:
  - Scenarios must describe only behavior observable by users or callers (CLI stdout/stderr and exit codes, `--json` fields, filesystem effects, UI or Protocol responses) and never substitute Rust types or function names for behavior
  - Must cover both happy paths and error paths (invalid input, change not found, validation failure)
  - When a command provides both human and `--json` output, both paths must be covered, along with behavior under `--no-color`
  - CLI command specs must include subcommands, flags, stdin input (if any), success/failure exit codes, and output streams (stdout vs stderr)
  - '`--json` specs must include the payload structure: field names (camelCase) and types'
  - 'Filesystem effects must be explicit: which files are created or modified (proposal.md, delta spec, .meta.yaml, .speclink/ touched records and snapshots)'
  - Language-related behavior must specify expectations under `tw` / `ja` / `en` (or unset), including Chinese weak-language detection
  - Remote-path specs must specify observable behavior under revision conflicts, offline states, and expired/invalid authentication
  - Specs touching existing output must state whether existing byte-for-byte output is preserved or deliberately changed (and describe the before/after difference)
  tasks:
  - Rust unit and integration tests use `#[cfg(test)]` or Cargo test targets run with `cargo test`; frontend workspaces run Vitest via `npm test -w <workspace>`; output regression verification uses integration tests in crates/engine/speclink-core/tests/golden and crates/adapters/speclink-cli/tests/
  - Every task must specify affected repo-root relative paths (covering actual scope under crates/, apps/, packages/, scripts/, etc.); filenames follow design naming conventions, and CLI commands are named only when CLI is involved
  - Tasks modifying existing output must verify that golden and CLI tests still pass, or deliberately update goldens in the same batch
  - Tasks involving `--json` must assert the payload structure (field presence, camelCase naming, and types)
  - 'Task verification steps run only tests covering the affected surface: for Rust Cargo packages (under crates/ or apps/desktop) use `cargo test -p <package>`, adding `--test <target>` when an integration test target exists; for frontend use `npm test -w <workspace>` as declared in the manifest; for crates/adapters/speclink-node build the napi binding first with `npm --prefix crates/adapters/speclink-node run build` then run `npm --prefix crates/adapters/speclink-node test`; for scripts/ always run the whole suite `node --test scripts/*.test.mjs scripts/*/*.test.mjs` (under one second, regardless of affected file); the full `npm run test:all` suite is gated by CI (.github/workflows/ci.yml) only and is not written into task verification steps'
  - 'Regardless of affected surface, the final task in tasks.md must include `node --test scripts/*.test.mjs scripts/*/*.test.mjs` in its verification step: the vocabulary guard, bilingual parity, and link checks in scripts/ scan the entire README and docs surface, so changes touching only speclink/, docs/, or LANGUAGE.md can fail them, and when they fail CI skips all four UI, Desktop, Server Web, and Rust test suites'
  - 'Bug-fix changes must include a task to audit similar locations: state the search pattern and matched files, and mark each as fixed together or explain why it is left untouched'
  - When changing the external interface of `@speclink/engine` (exports in crates/adapters/speclink-node/index.d.ts, or options of `createHost` / `createEngine`), must include a task to sync docs/sdk-node.md and docs/sdk-node.zh-TW.md; when adding, renaming, or removing exported names, the same task must also update the "What the package contains" table in crates/adapters/speclink-node/README.md
  - 'When adding, renaming, or removing `--json` output or HTTP response fields, must include a task to sync docs/verb-contract.md and docs/verb-contract.zh-TW.md: search every occurrence of the field and output across the docs (e.g., keys printed by `list --json`, field tables for `GET /changes`) and update each one'

review:
  critical:
  - Callers must not override @speclink/ui component variant colors, border radius, or shadows with className; provide needed appearances through variants instead
  warning:
  - System-wide shared behavior (e.g., back navigation, keyboard shortcuts, callouts) must be implemented once in the shared layer with pages wiring into it; new pages must connect to the existing shared implementation rather than rewriting it per page
  - When adding features, reuse existing components, editors, or utility functions already in the repo (e.g., @speclink/ui components, the shared code editor on settings pages) rather than building a parallel implementation
  - For bug-fix changes, if the same pattern or component type has the same defect elsewhere in the repo, fix it in the same change or state in tasks.md why it is not fixed
  - Present the same operation with the same component and variant across pages (e.g., buttons, menus, pagination controls, empty states) so identical operations do not look different across pages
